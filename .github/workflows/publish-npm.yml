name: Publish npm package

'on':
  workflow_call:
    inputs:
      registry-url:
        required: true
        type: string
      node-version:
        required: true
        type: string
      provenance:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.registry-url }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No permissions block: the job takes the caller's, so the GitHub Packages
    # caller grants packages: write and the npm caller grants id-token: write.
    steps:
      - name: Checkout
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: false
          persist-credentials: false

      - name: Setup node
        # v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: Check whether this version is already published
        id: published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          FOUND="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
          if [ "$FOUND" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already published, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn build
          # A prerelease (e.g. 1.0.0-alpha.1) must not become the "latest" tag.
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          # Provenance is signed with the job's OIDC token and only npmjs.com
          # accepts it, so GitHub Packages keeps the plain yarn publish.
          if [ "$PROVENANCE" = "true" ]; then
            npm publish --provenance --access public --tag "$TAG"
          else
            yarn publish --access public --non-interactive --tag "$TAG"
          fi
